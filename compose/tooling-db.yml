services:
  tooling-db:
    image: postgres:16
    container_name: tooling-db
    # Chứa DB của Metabase và Iceberg catalog: không publish ra host, chỉ truy cập
    # trong kafka-net. Debug: docker compose exec tooling-db psql -U admin -d metabase
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: admin
      # Chỉ áp dụng lúc initdb; DB đã có thì chạy `make tooling-db-roles` để đồng bộ.
      POSTGRES_PASSWORD: ${TOOLING_DB_PASSWORD:?TOOLING_DB_PASSWORD must be set}
      PGPORT: 5435
    volumes:
      - ./tooling-db-volumes:/var/lib/postgresql/data
      - ./ddl/tooling:/docker-entrypoint-initdb.d:ro
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
