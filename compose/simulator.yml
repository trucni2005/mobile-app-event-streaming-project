services:
  simulator:
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
    container_name: simulator
    # API không có auth (POST ghi thẳng vào DB): chỉ bind 127.0.0.1.
    # Code nằm trong image (không bind-mount); sửa code thì `make build`.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PG_HOST=${PG_HOST}
      - PG_PORT=5432
      - PG_DATABASE=${PG_DATABASE}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

networks:
  # Vùng mạng của backend (OLTP): chỉ postgres, simulator (đóng vai backend app)
  # và kconnect (cầu nối CDC duy nhất sang data platform) được gắn vào.
  backend-net:
    driver: bridge
