services:
  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on:
      - iceberg-rest
    # Trino chưa bật auth: chỉ bind 127.0.0.1, truy cập từ xa bằng SSH tunnel qua VPN.
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/etc/config.properties:/etc/trino/config.properties
    networks:
      - kafka-net

  # Metabase Service
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    # Có đăng nhập nên bind theo BIND_ADDR (127.0.0.1 hoặc IP interface VPN).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: tooling-db
      MB_DB_PORT: 5435
      MB_DB_USER: admin
      MB_DB_PASS: ${TOOLING_DB_PASSWORD:?TOOLING_DB_PASSWORD must be set}
      MB_PLUGINS_DIR: /tmp/metabase_plugins
    depends_on:
      - tooling-db
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
