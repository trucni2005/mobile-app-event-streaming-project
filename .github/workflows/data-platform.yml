# Data platform: Kafka/CDC, MinIO + Iceberg, Spark, Trino/Metabase. Chỉ chạy khi
# đổi file thuộc data platform hoặc file dùng chung (compose entrypoint, .env.example).
#
# CI: lint → build image + validate compose.
# CD: push vào main và mọi job xanh → đẩy image spark lên GHCR.
name: data-platform

on:
  push:
    branches: [main]
    paths: &data-paths
      - compose/kafka.yml
      - compose/storage.yml
      - compose/spark.yml
      - compose/bi.yml
      - compose/tooling-db.yml
      - ddl/tooling/**
      - schema/**
      - spark/**
      - docker/spark/**
      - trino/**
      - requirements.txt
      - docker-compose.yml
      - .env.example
      - Makefile
      - scripts/check_exposure.py
      - .github/workflows/data-platform.yml
  pull_request:
    branches: [main]
    paths: *data-paths
  # Chạy tay (vd. publish lại image từ main) trong tab Actions.
  workflow_dispatch:

# Mặc định token chỉ đọc; job nào cần thêm quyền thì tự khai báo.
permissions:
  contents: read

# PR push commit mới thì huỷ run cũ; main thì để chạy hết, không huỷ giữa lúc publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/spark

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: ruff check spark
      - run: jq empty schema/adjust-event.avsc

  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Chỉ build để kiểm tra; cache layer (base image + jars) lưu vào GHA để
      # job publish và các lần build sau không tải lại.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark/Dockerfile
          push: false
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
      # .env bị gitignore nên runner không có; dùng giá trị mẫu chỉ để validate compose.
      - run: cp .env.example .env
      - run: docker compose config -q
      # Không service nào được publish port ra ngoài 127.0.0.1.
      - run: docker compose config --format json | python3 scripts/check_exposure.py

  # CD: chưa có server nên "deploy" = đẩy image lên GHCR. Tag sha-<commit> để
  # server sau này pull đúng bản đã qua CI; latest luôn trỏ bản mới nhất của main.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=spark
